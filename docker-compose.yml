# Compose para o servidor da FEMA / Coolify (Build Pack: Docker Compose).
# Funciona sem configurar nada: publica o front e a API em portas do servidor,
# como no projeto dos colegas (ex.: http://computacao.fema.edu.br:8140).
#
# Variáveis opcionais (se quiser mudar, crie no Coolify em Environment Variables):
#   PUBLIC_HOST  endereço do servidor      (padrão: computacao.fema.edu.br)
#   WEB_PORT     porta pública do front    (padrão: 8140)
#   API_PORT     porta pública da API      (padrão: 8141)
#   JWT_SECRET   chave do token (32+ caracteres) - o padrão abaixo é público no GitHub,
#                troque quando possível.
#   DB_PASSWORD  senha do banco (o banco NÃO é exposto fora do compose)
#
# Teste local: docker compose -f docker-compose.local.yml up --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: meu_atelie
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meu_atelie"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/meu_atelie
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-meu_atelie_chave_jwt_tcc_fema_2026_desenvolvimento_seguro_abc123}
      CORS_ALLOWED_ORIGINS: http://${PUBLIC_HOST:-computacao.fema.edu.br}:${WEB_PORT:-8140}
    ports:
      - "${API_PORT:-8141}:8080"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_URL: http://${PUBLIC_HOST:-computacao.fema.edu.br}:${API_PORT:-8141}
    ports:
      - "${WEB_PORT:-8140}:80"

volumes:
  db_data:
  uploads_data:
