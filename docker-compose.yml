# Compose para o Coolify (Build Pack: Docker Compose).
# O Coolify gera domínio/HTTPS e usuário/senha do banco automaticamente pelas variáveis SERVICE_*.
# Única variável que VOCÊ preenche na tela do Coolify: JWT_SECRET (32+ caracteres).
# Para testar local, use: docker compose -f docker-compose.local.yml up --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: meu_atelie
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d meu_atelie"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SERVICE_URL_BACKEND_8080
      - DB_URL=jdbc:postgresql://db:5432/meu_atelie
      - DB_USERNAME=${SERVICE_USER_POSTGRES}
      - DB_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ALLOWED_ORIGINS=${SERVICE_URL_FRONTEND}
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - SERVICE_URL_FRONTEND_80
      - API_URL=${SERVICE_URL_BACKEND}

volumes:
  db_data:
  uploads_data:
