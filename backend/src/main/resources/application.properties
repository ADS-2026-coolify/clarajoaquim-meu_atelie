spring.application.name=meu-atelie

# Banco de dados (valores vêm de variáveis de ambiente; o padrão serve só para rodar local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/TCC_Meu_Atelie}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Cria/atualiza as tabelas a partir das entidades e carrega o data.sql (canais de aquisição)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${PORT:8080}

# Origens permitidas no CORS (URL do front, separadas por vírgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
